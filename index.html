    <!-- LÓGICA DEL ROTADOR DE WHATSAPP -->
    <script>
        // Lista de números para rotar
        const whatsappNumbers = [
            '5491161116630',
            '5491125746106',
            '5491161160630'
        ];

        // Mensaje predeterminado para el chat
        const defaultMessage = encodeURIComponent("Hola! Quiero crear mi usuario y aprovechar el bono de depósito");

        // Función para obtener el siguiente número usando localStorage para una distribución equitativa
        function getRotatedNumber() {
            let currentIndex = parseInt(localStorage.getItem('wa_rotator_index') || '0', 10);
            const selectedNumber = whatsappNumbers[currentIndex % whatsappNumbers.length];
            
            // Incrementar para la siguiente visita / clic
            localStorage.setItem('wa_rotator_index', (currentIndex + 1) % whatsappNumbers.length);
            
            return selectedNumber;
        }

        // Configura el enlace dinámico al cargar la página
        function setupWhatsappButton() {
            const btn = document.getElementById('whatsappBtn');
            if (btn) {
                const number = getRotatedNumber();
                btn.href = `https://wa.me/${number}?text=${defaultMessage}`;
            }
        }

        // Maneja el clic, dispara evento Meta Pixel y redirige
        function redirectToRotatedWhatsapp(event) {
            // Disparar evento de Meta Pixel
            if (typeof fbq === 'function') {
                fbq('track', 'Contact');
            }
        }

        // Inicializar al cargar
        document.addEventListener('DOMContentLoaded', setupWhatsappButton);
    </script>
